<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Naciones</title>

  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="shortcut icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#005b92">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #dce2e6; color: #18232d; min-height: 100vh;
    }

    .header-naciones {
      background-color: #005b92; padding: 10px 16px;
      display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); position: sticky; top: 0; z-index: 100;
    }
    .logo-center-box { grid-column: 2; display: flex; justify-content: center; align-items: center; }
    .img-logo-naciones { max-height: 32px; width: auto; object-fit: contain; display: block; }

    .btn-menu-hamburguesa {
      grid-column: 1; background: transparent; border: 0; color: white; font-size: 24px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 6px; width: 40px; height: 40px;
    }
    .btn-menu-hamburguesa:active { background: rgba(255,255,255,0.2); }

    .drawer-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
    .drawer-overlay.activo { display: block; }

    .drawer-menu {
      position: fixed; top: 0; left: -270px; width: 270px; height: 100vh;
      background: #ffffff; z-index: 201; transition: left 0.3s ease;
      display: flex; flex-direction: column; box-shadow: 4px 0 16px rgba(0,0,0,0.15); overflow-y: auto;
    }
    .drawer-menu.activo { left: 0; }

    .drawer-header { background: #005b92; color: white; padding: 24px 16px; display: flex; align-items: center; gap: 12px; }
    .drawer-item {
      padding: 16px 20px; font-size: 13.5px; font-weight: 700; color: #2b363f;
      border-bottom: 1px solid #f0f3f5; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .drawer-item:active { background: #eef3f6; }
    .drawer-item.cerrar-sesion { color: #a52828; margin-top: auto; border-top: 1px solid #e2e8f0; }

    .contenedor { max-width: 440px; margin: 0 auto; padding: 16px 12px 32px; }

    .tarjeta { background: #ffffff; border-radius: 18px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
    .marca { color: #71808e; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; color: #0d171e; }
    .subtitulo { color: #71808e; font-size: 13px; line-height: 1.5; }
    label { display: block; font-weight: 700; margin: 16px 0 8px; font-size: 13.5px; }
    input, select { width: 100%; padding: 13px; border: 1px solid #cbd3d9; border-radius: 10px; font-size: 15px; background: #fff; }
    button { cursor: pointer; border: 0; font-family: inherit; }
    .boton-principal { width: 100%; margin-top: 20px; background: #005b92; color: white; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700; }

    .nombre-usuario { font-size: 21px; font-weight: 800; color: #0d171e; margin: 4px 0 2px; }
    .qr-contenedor { text-align: center; padding: 16px 0 8px; }
    .qr-imagen { width: 180px; height: 180px; display: block; margin: 0 auto; }
    .qr-numero { font-family: "Montserrat", Arial, sans-serif; font-style: italic; font-weight: 600; font-size: 16px; color: #2b363f; margin-top: 10px; }

    .oculto { display: none !important; }
    #mensaje { margin-top: 14px; color: #a52828; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

<div id="drawerOverlay" class="drawer-overlay"></div>
<aside id="drawerMenu" class="drawer-menu">
  <div class="drawer-header">
    <strong id="drawerNombreUser">NACIONES</strong>
  </div>
  <div id="itemMiCuenta" class="drawer-item">MI CUENTA</div>
  <div id="itemRegistro" class="drawer-item oculto">REGISTRO (ESCANEAR QR)</div>
  <div id="itemCerrarSesion" class="drawer-item cerrar-sesion">CERRAR SESIÓN</div>
</aside>

<header class="header-naciones">
  <button id="btnHamburguesa" class="btn-menu-hamburguesa oculto" type="button" aria-label="Menú">☰</button>
  <div class="logo-center-box">
    <img src="https://lh3.googleusercontent.com/d/1CWjOrXs_fzYi9Jnn4ofJ8rSGNghZu26H" alt="Naciones" class="img-logo-naciones">
  </div>
</header>

<main class="contenedor">

  <!-- ACCESO PRINCIPAL -->
  <section class="tarjeta" id="acceso">
    <div class="marca">Iglesia Naciones</div>
    <h1>Portal de seguimiento</h1>
    <form id="formulario">
      <label for="registro">Número de registro</label>
      <input id="registro" name="registro" type="text" autocomplete="off" required placeholder="Tu número de registro">
      
      <label for="nacimiento">Fecha de nacimiento</label>
      <input id="nacimiento" name="nacimiento" type="text" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="off" required>
      
      <button class="boton-principal" id="boton" type="submit">Consultar mi avance</button>
    </form>
    <div id="mensaje"></div>
  </section>

  <!-- PANEL DE USUARIO -->
  <section id="panel" class="oculto">

    <!-- MI CUENTA -->
    <div id="vistaCuenta">
      <section class="tarjeta">
        <div class="marca" id="badgeRol">Mi Cuenta</div>
        <div class="nombre-usuario" id="nombre"></div>
        <p class="subtitulo" id="campus"></p>

        <div class="qr-contenedor">
          <img id="qrImagen" class="qr-imagen" src="" alt="Código QR">
          <div id="qrNumero" class="qr-numero"></div>
        </div>
      </section>
    </div>

    <!-- MODULO DE REGISTRO / ESCÁNER (VOLUNTARIOS) -->
    <div id="vistaRegistro" class="oculto">
      <section class="tarjeta">
        <div class="marca">Módulo de Asistencia</div>
        <h1>Escanear Código QR</h1>
        <div id="reader" style="width: 100%; min-height: 250px;"></div>
        <div id="msgEscaner" style="margin-top:12px; font-weight:bold; text-align:center;"></div>
      </section>
    </div>

  </section>
</main>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdRmnu2IQqheZ-yJdI0Fr5GnHFc4ogE5UDyx1pik68gylS3wmzJSsIqTctCRwyRVyyeQ/exec';

  let usuarioSesion = null;

  const btnHamburguesa = document.getElementById('btnHamburguesa');
  const drawerOverlay = document.getElementById('drawerOverlay');
  const drawerMenu = document.getElementById('drawerMenu');

  btnHamburguesa.addEventListener('click', () => abrirMenu(true));
  drawerOverlay.addEventListener('click', () => abrirMenu(false));

  document.getElementById('itemMiCuenta').addEventListener('click', () => { abrirMenu(false); mostrarVista('cuenta'); });
  document.getElementById('itemRegistro').addEventListener('click', () => { abrirMenu(false); mostrarVista('registro'); });
  document.getElementById('itemCerrarSesion').addEventListener('click', () => { abrirMenu(false); cerrarSesion(); });

  function abrirMenu(abrir) {
    drawerOverlay.classList.toggle('activo', abrir);
    drawerMenu.classList.toggle('activo', abrir);
  }

  function mostrarVista(vista) {
    document.getElementById('vistaCuenta').classList.add('oculto');
    document.getElementById('vistaRegistro').classList.add('oculto');

    if (vista === 'cuenta') document.getElementById('vistaCuenta').classList.remove('oculto');
    if (vista === 'registro') document.getElementById('vistaRegistro').classList.remove('oculto');
  }

  document.getElementById('formulario').addEventListener('submit', function(e) {
    e.preventDefault();
    const registro = document.getElementById('registro').value.trim();
    const nacimiento = document.getElementById('nacimiento').value.trim();
    document.getElementById('mensaje').textContent = 'Consultando...';

    fetch(`${WEB_APP_URL}?action=buscarParticipante&registro=${encodeURIComponent(registro)}&nacimiento=${encodeURIComponent(nacimiento)}`)
      .then(res => res.json())
      .then(res => {
        if (res.encontrado) {
          document.getElementById('mensaje').textContent = '';
          usuarioSesion = res;
          mostrarPanel(res);
        } else {
          document.getElementById('mensaje').textContent = 'Credenciales no encontradas.';
        }
      })
      .catch(() => {
        document.getElementById('mensaje').textContent = 'Error al conectar con el servidor.';
      });
  });

  function mostrarPanel(res) {
    document.getElementById('acceso').classList.add('oculto');
    document.getElementById('panel').classList.remove('oculto');
    btnHamburguesa.classList.remove('oculto');

    document.getElementById('nombre').textContent = res.nombre + ' ' + res.apellidos;
    document.getElementById('campus').textContent = 'Campus: ' + res.campus;
    document.getElementById('qrImagen').src = 'https://quickchart.io/qr?text=' + res.registro + '&size=220';
    document.getElementById('qrNumero').textContent = res.registro;

    // EVALUACIÓN DE ROLES DESDE USUARIOS PORTAL NACIONES
    const rol = String(res.rol || '').toUpperCase();
    document.getElementById('badgeRol').textContent = rol ? ('ROL: ' + rol) : 'MI CUENTA';

    const esVoluntarioValido = (rol === 'REGISTRO' || rol === 'ADMIN_CAMPUS' || rol === 'ADMIN_GLOBAL');

    document.getElementById('itemRegistro').classList.toggle('oculto', !esVoluntarioValido);

    mostrarVista('cuenta');
  }

  function cerrarSesion() {
    usuarioSesion = null;
    document.getElementById('panel').classList.add('oculto');
    document.getElementById('acceso').classList.remove('oculto');
    btnHamburguesa.classList.add('oculto');
    document.getElementById('formulario').reset();
  }
</script>
</body>
</html>
